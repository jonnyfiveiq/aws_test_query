---
# AWS Indirect Node Counting Test Playbook (Expanded)
# Uses only FREE resources for testing indirect node counting
#
# FREE AWS Resources used:
#   - VPC (free) - can use existing or create new
#   - Subnets (free)
#   - Internet Gateway (free)
#   - Route Tables (free)
#   - Security Groups (free)
#   - S3 Buckets (free to create)
#   - IAM Roles (free)
#   - IAM Policies (free)
#   - EC2 Key Pairs (free)
#
# Prerequisites:
#   - amazon.aws collection installed
#   - AWS credentials with appropriate permissions
#
# Usage:
#   # Create new VPC (default)
#   ansible-playbook aws_indirect_node_test_fixed.yml
#
#   # Use existing VPC (avoids VpcLimitExceeded error)
#   ansible-playbook aws_indirect_node_test_fixed.yml -e use_existing_vpc=true
#   ansible-playbook aws_indirect_node_test_fixed.yml -e existing_vpc_id=vpc-xxxxxxxx
#
#   # Use different region
#   ansible-playbook aws_indirect_node_test_fixed.yml -e aws_region=us-west-2
#
#   # Skip cleanup
#   ansible-playbook aws_indirect_node_test_fixed.yml -e cleanup=false

- name: AWS Indirect Node Counting Test (Expanded)
  hosts: localhost
  gather_facts: false

  vars:
    my_aws_region: "{{ aws_region | default('us-east-1') }}"
    my_test_prefix: "{{ resource_prefix | default('aap-indirect-test') }}"
    my_cleanup: "{{ cleanup | default(true) | bool }}"
    
    # VPC options - set use_existing_vpc=true to avoid VpcLimitExceeded
    use_existing_vpc: "{{ use_existing_vpc | default(false) | bool }}"
    existing_vpc_id: "{{ existing_vpc_id | default('') }}"
    
    # VPC CIDR (only used if creating new VPC)
    vpc_cidr: "10.100.0.0/16"
    
    # Subnet CIDRs
    subnet_cidrs:
      - { name: "web", cidr: "10.100.1.0/24", az_suffix: "a" }
      - { name: "app", cidr: "10.100.2.0/24", az_suffix: "b" }
      - { name: "db", cidr: "10.100.3.0/24", az_suffix: "c" }

  tasks:
    # =========================================
    # VALIDATE CREDENTIALS
    # =========================================
    
    - name: Validate AWS credentials
      amazon.aws.aws_caller_info:
      register: caller_info

    - name: Display account info
      ansible.builtin.debug:
        msg: "Running as: {{ caller_info.arn }} in account {{ caller_info.account }}"

    - name: Generate unique suffix
      ansible.builtin.set_fact:
        unique_suffix: "{{ 999999 | random | string }}"

    # =========================================
    # VPC HANDLING - EXISTING OR NEW
    # =========================================

    - name: Check current VPC count
      amazon.aws.ec2_vpc_net_info:
        region: "{{ my_aws_region }}"
      register: all_vpcs

    - name: Display VPC status
      ansible.builtin.debug:
        msg: |
          Current VPCs in {{ my_aws_region }}: {{ all_vpcs.vpcs | length }}
          {% if all_vpcs.vpcs | length >= 5 and not use_existing_vpc and existing_vpc_id == '' %}
          WARNING: You have {{ all_vpcs.vpcs | length }} VPCs. Default limit is 5.
          Consider using: -e use_existing_vpc=true or -e existing_vpc_id=vpc-xxxxx
          {% endif %}

    # Option 1: Use explicitly provided VPC ID
    - name: Use provided existing VPC
      when: existing_vpc_id != ''
      block:
        - name: Get existing VPC info
          amazon.aws.ec2_vpc_net_info:
            region: "{{ my_aws_region }}"
            vpc_ids:
              - "{{ existing_vpc_id }}"
          register: existing_vpc_info

        - name: Set VPC facts from existing VPC
          ansible.builtin.set_fact:
            vpc_id: "{{ existing_vpc_id }}"
            vpc_cidr: "{{ existing_vpc_info.vpcs[0].cidr_block }}"
            vpc_created: false

        - name: Calculate subnet CIDRs for existing VPC
          ansible.builtin.set_fact:
            subnet_cidrs:
              - { name: "web", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 1) }}", az_suffix: "a" }
              - { name: "app", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 2) }}", az_suffix: "b" }
              - { name: "db", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 3) }}", az_suffix: "c" }

    # Option 2: Find and use default VPC or first available VPC
    - name: Use existing VPC (auto-select)
      when: use_existing_vpc | bool and existing_vpc_id == ''
      block:
        - name: Find default VPC
          ansible.builtin.set_fact:
            default_vpc: "{{ all_vpcs.vpcs | selectattr('is_default', 'equalto', true) | list | first | default(none) }}"

        - name: Use default VPC if available
          ansible.builtin.set_fact:
            vpc_id: "{{ default_vpc.vpc_id }}"
            vpc_cidr: "{{ default_vpc.cidr_block }}"
            vpc_created: false
          when: default_vpc is not none

        - name: Use first available VPC if no default
          ansible.builtin.set_fact:
            vpc_id: "{{ all_vpcs.vpcs[0].vpc_id }}"
            vpc_cidr: "{{ all_vpcs.vpcs[0].cidr_block }}"
            vpc_created: false
          when: default_vpc is none and all_vpcs.vpcs | length > 0

        - name: Calculate subnet CIDRs for existing VPC
          ansible.builtin.set_fact:
            subnet_cidrs:
              - { name: "web", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 1) }}", az_suffix: "a" }
              - { name: "app", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 2) }}", az_suffix: "b" }
              - { name: "db", cidr: "{{ vpc_cidr | ansible.utils.ipsubnet(24, 3) }}", az_suffix: "c" }

        - name: Display selected VPC
          ansible.builtin.debug:
            msg: "Using existing VPC: {{ vpc_id }} ({{ vpc_cidr }})"

    # Option 3: Create new VPC (original behavior)
    - name: Create new VPC
      when: not use_existing_vpc | bool and existing_vpc_id == ''
      block:
        - name: Create VPC
          amazon.aws.ec2_vpc_net:
            name: "{{ my_test_prefix }}-vpc-{{ unique_suffix }}"
            cidr_block: "{{ vpc_cidr }}"
            region: "{{ my_aws_region }}"
            tags:
              Environment: test
              Purpose: aap-indirect-node-counting
          register: vpc_result

        - name: Set VPC facts from new VPC
          ansible.builtin.set_fact:
            vpc_id: "{{ vpc_result.vpc.id }}"
            vpc_created: true

    - name: Query VPC info
      amazon.aws.ec2_vpc_net_info:
        region: "{{ my_aws_region }}"
        vpc_ids:
          - "{{ vpc_id }}"
      register: vpc_info

    # =========================================
    # SUBNETS (FREE)
    # =========================================

    - name: Check for existing subnets with our CIDRs
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ my_aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: existing_subnets

    - name: Create subnets (skip if CIDR already exists)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ item.cidr }}"
        az: "{{ my_aws_region }}{{ item.az_suffix }}"
        region: "{{ my_aws_region }}"
        tags:
          Name: "{{ my_test_prefix }}-subnet-{{ item.name }}-{{ unique_suffix }}"
          Environment: test
      loop: "{{ subnet_cidrs }}"
      when: item.cidr not in (existing_subnets.subnets | map(attribute='cidr_block') | list)
      register: subnet_results
      ignore_errors: true

    - name: Query subnet info
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ my_aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnet_info

    # =========================================
    # INTERNET GATEWAY (FREE)
    # =========================================

    - name: Check for existing internet gateway
      amazon.aws.ec2_vpc_igw_info:
        region: "{{ my_aws_region }}"
        filters:
          attachment.vpc-id: "{{ vpc_id }}"
      register: existing_igw

    - name: Create internet gateway (if not exists)
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        tags:
          Name: "{{ my_test_prefix }}-igw-{{ unique_suffix }}"
          Environment: test
      register: igw_result
      when: existing_igw.internet_gateways | length == 0

    - name: Set IGW ID
      ansible.builtin.set_fact:
        igw_id: "{{ igw_result.gateway_id | default(existing_igw.internet_gateways[0].internet_gateway_id) }}"
        igw_created: "{{ existing_igw.internet_gateways | length == 0 }}"

    - name: Query internet gateway info
      amazon.aws.ec2_vpc_igw_info:
        region: "{{ my_aws_region }}"
        filters:
          attachment.vpc-id: "{{ vpc_id }}"
      register: igw_info

    # =========================================
    # ROUTE TABLES (FREE)
    # =========================================

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        tags:
          Name: "{{ my_test_prefix }}-rt-public-{{ unique_suffix }}"
          Environment: test
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw_id }}"
      register: public_rt_result

    - name: Create private route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        tags:
          Name: "{{ my_test_prefix }}-rt-private-{{ unique_suffix }}"
          Environment: test
      register: private_rt_result

    - name: Query route table info
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ my_aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: rt_info

    # =========================================
    # SECURITY GROUPS (FREE)
    # =========================================

    - name: Create web security group
      amazon.aws.ec2_security_group:
        name: "{{ my_test_prefix }}-sg-web-{{ unique_suffix }}"
        description: "Web tier security group"
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        rules:
          - proto: tcp
            ports: 80
            cidr_ip: "0.0.0.0/0"
          - proto: tcp
            ports: 443
            cidr_ip: "0.0.0.0/0"
        tags:
          Name: "{{ my_test_prefix }}-sg-web-{{ unique_suffix }}"
          Environment: test
      register: sg_web

    - name: Create app security group
      amazon.aws.ec2_security_group:
        name: "{{ my_test_prefix }}-sg-app-{{ unique_suffix }}"
        description: "App tier security group"
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        rules:
          - proto: tcp
            ports: 8080
            cidr_ip: "{{ vpc_cidr }}"
        tags:
          Name: "{{ my_test_prefix }}-sg-app-{{ unique_suffix }}"
          Environment: test
      register: sg_app

    - name: Create database security group
      amazon.aws.ec2_security_group:
        name: "{{ my_test_prefix }}-sg-db-{{ unique_suffix }}"
        description: "Database tier security group"
        vpc_id: "{{ vpc_id }}"
        region: "{{ my_aws_region }}"
        rules:
          - proto: tcp
            ports: 5432
            cidr_ip: "{{ vpc_cidr }}"
        tags:
          Name: "{{ my_test_prefix }}-sg-db-{{ unique_suffix }}"
          Environment: test
      register: sg_db

    - name: Query security groups
      amazon.aws.ec2_security_group_info:
        region: "{{ my_aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: sg_info

    # =========================================
    # S3 BUCKETS (FREE to create)
    # =========================================

    - name: Create S3 buckets
      amazon.aws.s3_bucket:
        name: "{{ my_test_prefix }}-{{ item }}-{{ unique_suffix }}-{{ caller_info.account }}"
        state: present
        region: "{{ my_aws_region }}"
        tags:
          Environment: test
          Purpose: aap-indirect-node-counting
      loop:
        - "data"
        - "logs"
        - "backups"
      register: s3_buckets

    - name: Query S3 bucket info
      amazon.aws.s3_bucket_info:
        region: "{{ my_aws_region }}"
      register: s3_info

    # =========================================
    # IAM ROLES (FREE)
    # =========================================

    - name: Create IAM role for EC2
      amazon.aws.iam_role:
        name: "{{ my_test_prefix }}-ec2-role-{{ unique_suffix }}"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "ec2.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        description: "Test EC2 role for AAP indirect node counting"
        tags:
          Environment: test
      register: iam_role_ec2

    - name: Create IAM role for Lambda
      amazon.aws.iam_role:
        name: "{{ my_test_prefix }}-lambda-role-{{ unique_suffix }}"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        description: "Test Lambda role for AAP indirect node counting"
        tags:
          Environment: test
      register: iam_role_lambda

    - name: Query IAM roles
      amazon.aws.iam_role_info:
        name: "{{ my_test_prefix }}-ec2-role-{{ unique_suffix }}"
      register: iam_role_info

    # =========================================
    # IAM POLICIES (FREE)
    # =========================================

    - name: Create IAM policy
      amazon.aws.iam_managed_policy:
        policy_name: "{{ my_test_prefix }}-policy-{{ unique_suffix }}"
        policy_description: "Test policy for AAP indirect node counting"
        policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:ListBucket"
                ],
                "Resource": "*"
              }
            ]
          }
      register: iam_policy

    # =========================================
    # EC2 KEY PAIRS (FREE)
    # =========================================

    - name: Create EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ my_test_prefix }}-key-{{ unique_suffix }}"
        region: "{{ my_aws_region }}"
        tags:
          Environment: test
      register: ec2_key

    - name: Query EC2 key pairs
      amazon.aws.ec2_key_info:
        region: "{{ my_aws_region }}"
        names:
          - "{{ my_test_prefix }}-key-{{ unique_suffix }}"
      register: ec2_key_info

    # =========================================
    # QUERY REGIONS (FREE)
    # =========================================

    - name: Query AWS regions
      amazon.aws.aws_region_info:
        region: "{{ my_aws_region }}"
      register: region_info

    # =========================================
    # SUMMARY
    # =========================================

    - name: Display test summary
      ansible.builtin.debug:
        msg: |
          =====================================================
          AWS INDIRECT NODE TEST SUMMARY
          =====================================================
          
          ACCOUNT: {{ caller_info.account }}
          REGION:  {{ my_aws_region }}
          VPC:     {{ vpc_id }} {{ '(existing)' if not vpc_created | default(false) else '(created)' }}
          
          RESOURCES CREATED (all FREE):
            VPCs:              {{ 1 if vpc_created | default(false) else 0 }}
            Subnets:           {{ subnet_results.results | default([]) | selectattr('changed', 'defined') | selectattr('changed', 'equalto', true) | list | length }}
            Internet Gateways: {{ 1 if igw_created | default(false) else 0 }}
            Route Tables:      2
            Security Groups:   3
            S3 Buckets:        3
            IAM Roles:         2
            IAM Policies:      1
            EC2 Key Pairs:     1
          
          RESOURCES QUERIED (for indirect node counting):
            VPCs:              {{ vpc_info.vpcs | length }}
            Subnets:           {{ subnet_info.subnets | length }}
            Internet Gateways: {{ igw_info.internet_gateways | length }}
            Route Tables:      {{ rt_info.route_tables | length }}
            Security Groups:   {{ sg_info.security_groups | length }}
            S3 Buckets:        {{ s3_info.buckets | length }} (all in account)
          
          CLEANUP: {{ 'Resources will be deleted' if my_cleanup else 'Resources retained. Run with -e cleanup=true to delete.' }}
          =====================================================

    # =========================================
    # CLEANUP (Optional)
    # =========================================

    - name: Cleanup resources
      when: my_cleanup | bool
      block:
        - name: Delete EC2 key pair
          amazon.aws.ec2_key:
            name: "{{ my_test_prefix }}-key-{{ unique_suffix }}"
            region: "{{ my_aws_region }}"
            state: absent
          ignore_errors: true

        - name: Delete IAM policy
          amazon.aws.iam_managed_policy:
            policy_name: "{{ my_test_prefix }}-policy-{{ unique_suffix }}"
            state: absent
          ignore_errors: true

        - name: Delete IAM roles
          amazon.aws.iam_role:
            name: "{{ item }}"
            state: absent
          loop:
            - "{{ my_test_prefix }}-ec2-role-{{ unique_suffix }}"
            - "{{ my_test_prefix }}-lambda-role-{{ unique_suffix }}"
          ignore_errors: true

        - name: Delete S3 buckets
          amazon.aws.s3_bucket:
            name: "{{ my_test_prefix }}-{{ item }}-{{ unique_suffix }}-{{ caller_info.account }}"
            state: absent
            force: true
            region: "{{ my_aws_region }}"
          loop:
            - "data"
            - "logs"
            - "backups"
          ignore_errors: true

        - name: Delete security groups
          amazon.aws.ec2_security_group:
            group_id: "{{ item }}"
            region: "{{ my_aws_region }}"
            state: absent
          loop:
            - "{{ sg_web.group_id }}"
            - "{{ sg_app.group_id }}"
            - "{{ sg_db.group_id }}"
          ignore_errors: true

        - name: Get all route tables in VPC
          amazon.aws.ec2_vpc_route_table_info:
            region: "{{ my_aws_region }}"
            filters:
              vpc-id: "{{ vpc_id }}"
          register: all_route_tables

        - name: Delete test route tables (by tag)
          amazon.aws.ec2_vpc_route_table:
            route_table_id: "{{ item.id }}"
            vpc_id: "{{ vpc_id }}"
            region: "{{ my_aws_region }}"
            state: absent
            lookup: id
          loop: "{{ all_route_tables.route_tables }}"
          when: 
            - item.tags is defined
            - item.tags.Name is defined
            - my_test_prefix in item.tags.Name
            - item.associations is defined
            - item.associations | selectattr('main', 'defined') | selectattr('main', 'equalto', true) | list | length == 0
          ignore_errors: true

        # Only delete IGW if we created it
        - name: Delete internet gateway (only if we created it)
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ vpc_id }}"
            region: "{{ my_aws_region }}"
            state: absent
          when: igw_created | default(false)
          ignore_errors: true

        # Only delete subnets we created (by tag)
        - name: Get subnets with our tags
          amazon.aws.ec2_vpc_subnet_info:
            region: "{{ my_aws_region }}"
            filters:
              vpc-id: "{{ vpc_id }}"
              "tag:Environment": "test"
          register: test_subnets

        - name: Delete subnets we created
          amazon.aws.ec2_vpc_subnet:
            subnet_id: "{{ item.subnet_id }}"
            region: "{{ my_aws_region }}"
            state: absent
          loop: "{{ test_subnets.subnets }}"
          when:
            - item.tags is defined
            - item.tags.Name is defined
            - my_test_prefix in item.tags.Name
          ignore_errors: true

        - name: Wait for resources to be released
          ansible.builtin.pause:
            seconds: 10
          when: vpc_created | default(false)

        # Only delete VPC if we created it
        - name: Delete VPC (only if we created it)
          amazon.aws.ec2_vpc_net:
            vpc_id: "{{ vpc_id }}"
            region: "{{ my_aws_region }}"
            state: absent
          when: vpc_created | default(false)
          ignore_errors: true

        - name: Cleanup summary
          ansible.builtin.debug:
            msg: |
              =====================================================
              CLEANUP COMPLETE
              =====================================================
              {% if vpc_created | default(false) %}
              VPC {{ vpc_id }} and associated resources removed.
              {% else %}
              Existing VPC {{ vpc_id }} preserved.
              Only test resources (tagged with {{ my_test_prefix }}) were removed.
              {% endif %}
              If any errors occurred, check AWS Console.
              =====================================================
